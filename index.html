<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instagram Clone Editor</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<!-- LEFT EDITOR PANEL -->

<div class="editor">

<h2>Instagram Editor</h2>

<label>Username</label>
<input id="usernameInput">

<label>Posts</label>
<input id="postsInput">

<label>Followers</label>
<input id="followersInput">

<label>Following</label>
<input id="followingInput">

<label>Bio</label>
<textarea id="bioInput"></textarea>

<h3>Reel Insights</h3>

<label>Views</label>
<input id="viewsInput">

<label>Likes</label>
<input id="likesInput">

<button onclick="updateProfile()">Update Profile</button>

</div>


<!-- PHONE PREVIEW -->

<div class="preview">

<div class="phone">

<div class="profile">

<img src="assets/profile.jpg" id="profilePic">

<h3 id="username">username</h3>

<div class="stats">

<span id="posts">0</span> posts  
<span id="followers">0</span> followers  
<span id="following">0</span> following  

</div>

<p id="bio">Bio text</p>

</div>

<div class="reelInsights">

<h4>Reel Insights</h4>

Views: <span id="views">0</span><br>
Likes: <span id="likes">0</span>

</div>

<div class="grid">

<div class="post"></div>
<div class="post"></div>
<div class="post"></div>
<div class="post"></div>
<div class="post"></div>
<div class="post"></div>

</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
