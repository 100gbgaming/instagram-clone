<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Instagram Profile Clone</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<!-- LEFT EDIT PANEL -->

<div class="editor">

<h2>Profile Editor</h2>

<label>Username</label>
<input id="usernameInput">

<label>Posts</label>
<input id="postsInput">

<label>Followers</label>
<input id="followersInput">

<label>Following</label>
<input id="followingInput">

<label>Bio</label>
<textarea id="bioInput"></textarea>

<button onclick="updateProfile()">Update</button>

</div>


<!-- PHONE PREVIEW -->

<div class="preview">

<div class="phone">

<div class="header">
<h3 id="username">username</h3>
</div>


<div class="profile">

<img src="images/profile.jpg" class="profilePic">

<div class="stats">

<div>
<span id="posts">262</span>
<p>posts</p>
</div>

<div>
<span id="followers">965</span>
<p>followers</p>
</div>

<div>
<span id="following">11</span>
<p>following</p>
</div>

</div>

</div>


<div class="bio">

<b id="name">Gaming video creator</b>

<p id="bio">
MOM & DAD ❤️
SCARFALL 2.0 ❤️
</p>

</div>


<div class="dashboard">
Professional dashboard
</div>


<div class="buttons">

<button>Edit profile</button>
<button>Share profile</button>

</div>


<div class="tabs">

<span>⬛</span>
<span>▶</span>
<span>🔁</span>
<span>📷</span>

</div>


<div class="grid">

<div class="post"></div>
<div class="post"></div>
<div class="post"></div>

<div class="post"></div>
<div class="post"></div>
<div class="post"></div>

<div class="post"></div>
<div class="post"></div>
<div class="post"></div>

</div>


</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
